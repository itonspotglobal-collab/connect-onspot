<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- OnSpot brand purple background -->
  <rect width="32" height="32" rx="6" fill="#474ead"/>

  <!-- Rounded-square frame — the icon mark from the 2026 OnSpot logo -->
  <rect x="3.5" y="3.5" width="25" height="25" rx="5.5"
        fill="none" stroke="white" stroke-width="1.8"/>

  <!-- Letter 'o' — bold ring with centre dot (the "spot") -->
  <circle cx="11" cy="16" r="4" fill="none" stroke="white" stroke-width="2.2"/>
  <circle cx="11" cy="16" r="1.5" fill="white"/>

  <!-- Letter 'n' — left stem + right arch -->
  <line x1="17" y1="11.8" x2="17" y2="20.2"
        stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M17 13.4 C18.6 11 22.6 11 22.6 13.8 L22.6 20.2"
        fill="none" stroke="white" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
